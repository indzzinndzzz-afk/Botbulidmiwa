name: Build Flutter APK (Universal)

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Parse payload ────────────────────────────────────────────────────
      - name: Parse payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)"           >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)"                >> $GITHUB_OUTPUT
          echo "build_type=$(jq -r '.buildType // "release"' payload.json)" >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.appName // "MyApp"' payload.json)"  >> $GITHUB_OUTPUT
          echo "icon_url=$(jq -r '.iconUrl // ""' payload.json)"       >> $GITHUB_OUTPUT
          echo "flutter_version=$(jq -r '.flutterVersion // "stable"' payload.json)" >> $GITHUB_OUTPUT

      # ── 2. Setup Java ──────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Setup Flutter ──────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.parse.outputs.flutter_version }}
          cache: true

      # ── 4. Deteksi versi Flutter & Dart ──────────────────────────────────
      - name: Detect Flutter/Dart versions
        id: versions
        run: |
          FLUTTER_VER=$(flutter --version | head -1 | grep -oP '\d+\.\d+\.\d+')
          DART_VER=$(dart --version 2>&1 | grep -oP '\d+\.\d+\.\d+')
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "dart_version=$DART_VER" >> $GITHUB_OUTPUT
          echo "flutter_major=$(echo $FLUTTER_VER | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "flutter_minor=$(echo $FLUTTER_VER | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "dart_major=$(echo $DART_VER | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "dart_minor=$(echo $DART_VER | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "🔍 Flutter: $FLUTTER_VER, Dart: $DART_VER"

      # ════════════════════════════════════════════════════════════════════════
      # MODE ZIP — Build dari project Flutter yang diupload user
      # ════════════════════════════════════════════════════════════════════════
      - name: "[ZIP] Download & extract project"
        if: steps.parse.outputs.mode == 'zip'
        run: |
          wget -q -O project.zip "${{ steps.parse.outputs.url }}"
          unzip -q project.zip -d project

      - name: "[ZIP] Find Flutter root"
        if: steps.parse.outputs.mode == 'zip'
        id: root_zip
        run: |
          DIR=$(find project -name "pubspec.yaml" -maxdepth 5 | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      # ── AUTO-ADAPT: Sesuaikan dengan versi Flutter ──────────────────────────
      - name: "[ZIP] Auto-adapt build configs (Universal)"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          ANDROID_DIR="android"
          FLUTTER_MAJOR=${{ steps.versions.outputs.flutter_major }}
          FLUTTER_MINOR=${{ steps.versions.outputs.flutter_minor }}
          DART_MAJOR=${{ steps.versions.outputs.dart_major }}
          
          echo "🔧 Adapting untuk Flutter $FLUTTER_MAJOR.$FLUTTER_MINOR, Dart $DART_MAJOR"

          # ── 1. Gradle wrapper (UPGRADE KE VERSI TERBARU) ──────────────────
          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            # Deteksi apakah pakai Kotlin DSL (.kts) atau Groovy (.gradle)
            if [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
              # Kotlin DSL butuh Gradle 8.11.1+
              GRADLE_VER="8.11.1"
              echo "🔍 Detected Kotlin DSL → Gradle $GRADLE_VER"
            else
              # Groovy DSL, sesuaikan dengan versi Flutter
              if [ "$FLUTTER_MAJOR" -ge 3 ] && [ "$FLUTTER_MINOR" -ge 22 ]; then
                GRADLE_VER="8.7"
              elif [ "$FLUTTER_MAJOR" -ge 3 ]; then
                GRADLE_VER="8.6"
              else
                GRADLE_VER="7.6.3"
              fi
              echo "🔍 Detected Groovy DSL → Gradle $GRADLE_VER"
            fi
            
            sed -i "s|gradle-[0-9][0-9.]*-[a-z]*\.zip|gradle-${GRADLE_VER}-bin.zip|g" "$WRAPPER"
            echo "[OK] Gradle wrapper → $GRADLE_VER"
          fi

          # ── 2. AGP & Kotlin ──────────────────────────────────────────────────
          # Cek apakah pakai Kotlin DSL
          if [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            # Kotlin DSL - update di build.gradle.kts
            APP_GRADLE="$ANDROID_DIR/app/build.gradle.kts"
            ROOT_GRADLE="$ANDROID_DIR/build.gradle.kts"
            
            if [ -f "$ROOT_GRADLE" ]; then
              # Update AGP di build.gradle.kts
              sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.7.2"/g' "$ROOT_GRADLE"
              sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.0.20"/g' "$ROOT_GRADLE"
              echo "[OK] AGP → 8.7.2, Kotlin → 2.0.20 (Kotlin DSL)"
            fi
            
            if [ -f "$APP_GRADLE" ]; then
              # Update compileSdk di Kotlin DSL
              sed -i 's/compileSdk = [0-9]\+/compileSdk = 35/g' "$APP_GRADLE"
              sed -i 's/targetSdk = [0-9]\+/targetSdk = 35/g' "$APP_GRADLE"
              sed -i 's/minSdk = [0-9]\+/minSdk = 21/g' "$APP_GRADLE"
              echo "[OK] compileSdk → 35, targetSdk → 35, minSdk → 21"
            fi
          else
            # Groovy DSL - update di build.gradle
            ROOT_GRADLE="$ANDROID_DIR/build.gradle"
            if [ -f "$ROOT_GRADLE" ]; then
              if [ "$FLUTTER_MAJOR" -ge 3 ] && [ "$FLUTTER_MINOR" -ge 22 ]; then
                AGP_VER="8.3.2"
                KOTLIN_VER="1.9.24"
              elif [ "$FLUTTER_MAJOR" -ge 3 ] && [ "$FLUTTER_MINOR" -ge 16 ]; then
                AGP_VER="8.1.4"
                KOTLIN_VER="1.9.10"
              elif [ "$FLUTTER_MAJOR" -ge 3 ]; then
                AGP_VER="7.4.2"
                KOTLIN_VER="1.8.22"
              else
                AGP_VER="4.2.2"
                KOTLIN_VER="1.7.10"
              fi
              
              sed -i "s/com\.android\.tools\.build:gradle:[0-9][0-9.]*/com.android.tools.build:gradle:${AGP_VER}/g" "$ROOT_GRADLE"
              sed -i "s/kotlin_version\s*=\s*['\"][0-9][0-9.]*['\"]/kotlin_version = '${KOTLIN_VER}'/g" "$ROOT_GRADLE"
              sed -i "s/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9][0-9.]*/org.jetbrains.kotlin:kotlin-gradle-plugin:${KOTLIN_VER}/g" "$ROOT_GRADLE"
              echo "[OK] AGP → $AGP_VER, Kotlin → $KOTLIN_VER (Groovy DSL)"
            fi
            
            # ── 3. compileSdk (Groovy) ──────────────────────────────────────
            APP_GRADLE="$ANDROID_DIR/app/build.gradle"
            if [ -f "$APP_GRADLE" ]; then
              if [ "$FLUTTER_MAJOR" -ge 3 ] && [ "$FLUTTER_MINOR" -ge 22 ]; then
                TARGET_SDK=35
                JAVA_VER="17"
              elif [ "$FLUTTER_MAJOR" -ge 3 ]; then
                TARGET_SDK=34
                JAVA_VER="17"
              else
                TARGET_SDK=33
                JAVA_VER="11"
              fi
              
              sed -i "s/compileSdkVersion\s\+[0-9]\+/compileSdkVersion $TARGET_SDK/g" "$APP_GRADLE"
              sed -i "s/compileSdk\s\+[0-9]\+/compileSdk $TARGET_SDK/g" "$APP_GRADLE"
              sed -i "s/targetSdkVersion\s\+[0-9]\+/targetSdkVersion $TARGET_SDK/g" "$APP_GRADLE"
              sed -i "s/targetSdk\s\+[0-9]\+/targetSdk $TARGET_SDK/g" "$APP_GRADLE"
              sed -i "s/JavaVersion\.VERSION_[0-9]\+/JavaVersion.VERSION_${JAVA_VER}/g" "$APP_GRADLE"
              echo "[OK] compileSdk → $TARGET_SDK, Java → $JAVA_VER"
            fi
          fi

      # ── PUBSPEC: Auto-adjust Dart SDK constraint ───────────────────────────
      - name: "[ZIP] Auto-adjust pubspec.yaml"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          PUBSPEC="pubspec.yaml"
          DART_MAJOR=${{ steps.versions.outputs.dart_major }}
          DART_MINOR=${{ steps.versions.outputs.dart_minor }}
          
          if [ -f "$PUBSPEC" ]; then
            cp "$PUBSPEC" "$PUBSPEC.bak"
            
            CURRENT_LOWER=$(grep -oP "(?<=sdk:\s['\"]>=)[0-9.]+" "$PUBSPEC" | head -1 || echo "0.0.0")
            CURRENT_UPPER=$(grep -oP "(?<=sdk:\s['\"]>=[0-9.]+ <)[0-9.]+" "$PUBSPEC" | head -1 || echo "4.0.0")
            
            echo "📋 Current SDK: >=$CURRENT_LOWER <$CURRENT_UPPER"
            echo "🔧 Dart version: $DART_MAJOR.$DART_MINOR"
            
            LOWER_MAJOR=$(echo $CURRENT_LOWER | cut -d. -f1)
            if [ "$LOWER_MAJOR" -lt "$DART_MAJOR" ]; then
              NEW_LOWER="${DART_MAJOR}.0.0"
              echo "⬆️  Naikkan lower bound ke $NEW_LOWER"
            else
              NEW_LOWER=$CURRENT_LOWER
              echo "✅ Lower bound sudah OK"
            fi
            
            UPPER_MAJOR=$(echo $CURRENT_UPPER | cut -d. -f1)
            if [ "$UPPER_MAJOR" -lt $(($DART_MAJOR + 1)) ]; then
              NEW_UPPER="$(($DART_MAJOR + 1)).0.0"
              echo "⬆️  Longgarkan upper bound ke <$NEW_UPPER"
            else
              NEW_UPPER=$CURRENT_UPPER
              echo "✅ Upper bound sudah OK"
            fi
            
            sed -i "s/sdk:\s*['\"]>=[0-9.]*\s*<[0-9.]*['\"]/sdk: '>=$NEW_LOWER <$NEW_UPPER'/g" "$PUBSPEC"
            echo "✅ SDK constraint → >=$NEW_LOWER <$NEW_UPPER"
          fi

      # ── DEPENDENCY: Auto-resolve conflict ──────────────────────────────────
      - name: "[ZIP] Smart dependency resolution"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          echo "📦 Smart dependency resolution for Flutter ${{ steps.versions.outputs.flutter_version }}"
          
          # Coba pub get normal
          flutter pub get 2>&1 && {
            echo "✅ pub get sukses!"
            exit 0
          }
          
          echo "⚠️  pub get gagal, mencoba strategi alternatif..."
          
          # Strategi 1: Upgrade tanpa major versions
          flutter pub upgrade 2>&1 && {
            echo "✅ pub upgrade sukses!"
            exit 0
          }
          
          # Strategi 2: Upgrade dengan major versions
          echo "⚠️  pub upgrade gagal, coba dengan --major-versions"
          flutter pub upgrade --major-versions 2>&1 && {
            echo "✅ pub upgrade --major-versions sukses!"
            exit 0
          }
          
          # Strategi 3: Tambahkan dependency_overrides otomatis
          echo "⚠️  Masih gagal, tambahkan dependency_overrides otomatis"
          
          if grep -q "^dependency_overrides:" "pubspec.yaml"; then
            echo "dependency_overrides sudah ada, skip"
          else
            echo "" >> "pubspec.yaml"
            echo "dependency_overrides:" >> "pubspec.yaml"
            echo "  collection: any" >> "pubspec.yaml"
            echo "  meta: any" >> "pubspec.yaml"
            echo "  material_color_utilities: any" >> "pubspec.yaml"
            echo "  plugin_platform_interface: any" >> "pubspec.yaml"
            echo "  flutter_plugin_android_lifecycle: any" >> "pubspec.yaml"
            echo "✅ dependency_overrides ditambahkan"
          fi
          
          flutter pub get 2>&1 && {
            echo "✅ pub get dengan overrides sukses!"
            exit 0
          }
          
          # Strategi 4: Force dengan --offline
          echo "⚠️  Coba dengan --offline"
          flutter pub get --offline 2>&1 && {
            echo "✅ pub get --offline sukses!"
            exit 0
          }
          
          # Strategi 5: Clean & retry
          echo "⚠️  Terakhir: clean cache & retry"
          flutter clean
          rm -f pubspec.lock
          flutter pub get 2>&1 || {
            echo "❌ Semua strategi gagal! Periksa pubspec.yaml"
            echo "📋 Error log:"
            flutter pub get --verbose 2>&1 | tail -50
            exit 1
          }

      # ── BUILD APK ──────────────────────────────────────────────────────────
      - name: "[ZIP] Build APK"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          # Deteksi apakah pakai Kotlin DSL
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "🔍 Kotlin DSL detected - using Gradle 8.11.1"
            # Update gradle-wrapper.properties jika belum
            sed -i 's|gradle-[0-9][0-9.]*-[a-z]*\.zip|gradle-8.11.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          
          if [ "${{ steps.versions.outputs.flutter_major }}" -ge 3 ]; then
            flutter build apk --${{ steps.parse.outputs.build_type }} --no-tree-shake-icons
          else
            flutter build apk --${{ steps.parse.outputs.build_type }}
          fi

      - name: "[ZIP] Upload APK artifact"
        if: steps.parse.outputs.mode == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.root_zip.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ════════════════════════════════════════════════════════════════════════
      # MODE URL — Web2APK
      # ════════════════════════════════════════════════════════════════════════
      - name: "[URL] Create Flutter WebView project"
        if: steps.parse.outputs.mode == 'url'
        run: |
          flutter create --org com.gojocrasher --project-name webview_app webview_project
          cd webview_project
          flutter pub add webview_flutter

      - name: "[URL] Patch main.dart"
        if: steps.parse.outputs.mode == 'url'
        run: |
          cat > webview_project/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ steps.parse.outputs.app_name }}',
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ steps.parse.outputs.url }}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          DART

      - name: "[URL] Patch app name"
        if: steps.parse.outputs.mode == 'url'
        run: |
          APP="${{ steps.parse.outputs.app_name }}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP}\"/" \
            webview_project/android/app/src/main/AndroidManifest.xml

      - name: "[URL] Download & apply custom icon"
        if: steps.parse.outputs.mode == 'url' && steps.parse.outputs.icon_url != ''
        run: |
          wget -q -O icon_raw "${{ steps.parse.outputs.icon_url }}"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dir="mipmap-mdpi"    ;;
              72)  dir="mipmap-hdpi"    ;;
              96)  dir="mipmap-xhdpi"   ;;
              144) dir="mipmap-xxhdpi"  ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            TARGET="webview_project/android/app/src/main/res/${dir}"
            mkdir -p "$TARGET"
            convert icon_raw -resize ${size}x${size} "$TARGET/ic_launcher.png"
          done

      - name: "[URL] Flutter pub get"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter pub get

      - name: "[URL] Build APK"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter build apk --release --no-tree-shake-icons

      - name: "[URL] Upload APK artifact"
        if: steps.parse.outputs.mode == 'url'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: webview_project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
