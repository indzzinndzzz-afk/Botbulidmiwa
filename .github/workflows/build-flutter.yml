name: Build Flutter APK (Ultra Universal)

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Parse payload ────────────────────────────────────────────────────
      - name: Parse payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)"           >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)"                >> $GITHUB_OUTPUT
          echo "build_type=$(jq -r '.buildType // "release"' payload.json)" >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.appName // "MyApp"' payload.json)"  >> $GITHUB_OUTPUT
          echo "icon_url=$(jq -r '.iconUrl // ""' payload.json)"       >> $GITHUB_OUTPUT
          echo "flutter_version=$(jq -r '.flutterVersion // "stable"' payload.json)" >> $GITHUB_OUTPUT

      # ── 2. Setup Java ──────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Setup Flutter ──────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.parse.outputs.flutter_version }}
          cache: true

      # ── 4. Deteksi versi base ─────────────────────────────────────────────
      - name: Detect base versions
        id: versions
        run: |
          FLUTTER_VER=$(flutter --version | head -1 | grep -oP '\d+\.\d+\.\d+')
          DART_VER=$(dart --version 2>&1 | grep -oP '\d+\.\d+\.\d+')
          FLUTTER_BASE=$(echo $FLUTTER_VER | cut -d. -f1-2)
          DART_BASE=$(echo $DART_VER | cut -d. -f1-2)
          DART_MAJOR=$(echo $DART_VER | cut -d. -f1)
          
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "dart_version=$DART_VER" >> $GITHUB_OUTPUT
          echo "flutter_base=$FLUTTER_BASE" >> $GITHUB_OUTPUT
          echo "dart_base=$DART_BASE" >> $GITHUB_OUTPUT
          echo "dart_major=$DART_MAJOR" >> $GITHUB_OUTPUT
          echo "flutter_major=$(echo $FLUTTER_VER | cut -d. -f1)" >> $GITHUB_OUTPUT
          
          echo "🔍 Flutter base: $FLUTTER_BASE"
          echo "🔍 Dart base: $DART_BASE"
          echo "🔍 Dart major: $DART_MAJOR"

      # ════════════════════════════════════════════════════════════════════════
      # MODE ZIP
      # ════════════════════════════════════════════════════════════════════════
      - name: "[ZIP] Download & extract"
        if: steps.parse.outputs.mode == 'zip'
        run: |
          wget -q -O project.zip "${{ steps.parse.outputs.url }}"
          unzip -q project.zip -d project

      - name: "[ZIP] Find Flutter root"
        if: steps.parse.outputs.mode == 'zip'
        id: root_zip
        run: |
          DIR=$(find project -name "pubspec.yaml" -maxdepth 5 | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      # ── FIX GRADLE: Pakai versi terbaru ──────────────────────────────────
      - name: "[ZIP] Force Gradle 8.14+"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|gradle-[0-9][0-9.]*-[a-z]*\.zip|gradle-8.14.1-bin.zip|g' "$WRAPPER"
            echo "✅ Gradle → 8.14.1"
          fi

      # ── FIX KOTLIN DSL ──────────────────────────────────────────────────
      - name: "[ZIP] Fix Kotlin DSL"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "🔧 Fixing Kotlin DSL..."
            
            cat > android/build.gradle.kts << 'EOF'
            buildscript {
              repositories {
                google()
                mavenCentral()
              }
              dependencies {
                classpath("com.android.tools.build:gradle:8.7.2")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20")
                classpath("dev.flutter:flutter-gradle-plugin:1.0.0")
              }
            }

            allprojects {
              repositories {
                google()
                mavenCentral()
              }
            }

            rootProject.buildDir = "../build"
            subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
            }
            subprojects {
              project.evaluationDependsOn(":app")
            }

            tasks.register("clean", Delete) {
              delete(rootProject.buildDir)
            }
            EOF

            cat > android/app/build.gradle.kts << 'EOF'
            plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("dev.flutter.flutter-gradle-plugin")
            }

            android {
              namespace = "com.example.app"
              compileSdk = 35

              compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                jvmTarget = "17"
              }

              defaultConfig {
                applicationId = "com.example.app"
                minSdk = 21
                targetSdk = 35
                versionCode = 1
                versionName = "1.0"
              }

              buildTypes {
                release {
                  isMinifyEnabled = false
                  signingConfig = signingConfigs.getByName("debug")
                }
              }
            }

            flutter {
              source = "../.."
            }
            EOF

            echo "✅ Kotlin DSL fixed"
          fi

      # ── FIX GROOVY DSL ──────────────────────────────────────────────────
      - name: "[ZIP] Fix Groovy DSL"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          if [ -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "🔧 Fixing Groovy DSL..."
            
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.1-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties
            
            cat > android/build.gradle << 'EOF'
            buildscript {
              repositories {
                google()
                mavenCentral()
              }
              dependencies {
                classpath 'com.android.tools.build:gradle:8.7.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20"
              }
            }

            allprojects {
              repositories {
                google()
                mavenCentral()
              }
            }

            rootProject.buildDir = '../build'
            subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
            }
            subprojects {
              project.evaluationDependsOn(':app')
            }

            tasks.register('clean', Delete) {
              delete rootProject.buildDir
            }
            EOF

            echo "✅ Groovy DSL fixed"
          fi

      # ── PUBSPEC: Semua any mengikuti base ──────────────────────────────
      - name: "[ZIP] Make all dependencies 'any' (follow base)"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          PUBSPEC="pubspec.yaml"
          if [ -f "$PUBSPEC" ]; then
            cp "$PUBSPEC" "$PUBSPEC.bak"
            
            DART_MAJOR=${{ steps.versions.outputs.dart_major }}
            FLUTTER_BASE=${{ steps.versions.outputs.flutter_base }}
            
            echo "🔍 Base Flutter: $FLUTTER_BASE"
            echo "🔍 Base Dart major: $DART_MAJOR"
            
            # ── 1. SDK constraint mengikuti Dart base ──────────────────
            sed -i "s/sdk:.*/sdk: \">=${DART_MAJOR}.0.0 <$((DART_MAJOR+1)).0.0\"/g" "$PUBSPEC"
            
            # ── 2. Semua dependency jadi 'any' ──────────────────────────
            sed -i 's/: \^[0-9.]\+/: any/g' "$PUBSPEC"
            sed -i 's/: [0-9.]\+/: any/g' "$PUBSPEC"
            
            # ── 3. Tambahkan dependency_overrides ──────────────────────
            if ! grep -q "^dependency_overrides:" "$PUBSPEC"; then
              echo "" >> "$PUBSPEC"
              echo "dependency_overrides:" >> "$PUBSPEC"
              echo "  # Mengikuti versi base Flutter $FLUTTER_BASE" >> "$PUBSPEC"
              echo "  collection: any" >> "$PUBSPEC"
              echo "  meta: any" >> "$PUBSPEC"
              echo "  material_color_utilities: any" >> "$PUBSPEC"
              echo "  plugin_platform_interface: any" >> "$PUBSPEC"
              echo "  flutter_plugin_android_lifecycle: any" >> "$PUBSPEC"
            fi
            
            echo "✅ pubspec.yaml → semua mengikuti base Flutter $FLUTTER_BASE"
            echo "📋 SDK constraint: >=${DART_MAJOR}.0.0 <$((DART_MAJOR+1)).0.0"
          fi

      # ── PUB GET ──────────────────────────────────────────────────────────
      - name: "[ZIP] Pub get"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          flutter pub get 2>&1 || {
            echo "⚠️  pub get gagal, coba upgrade"
            flutter pub upgrade --major-versions 2>&1 || {
              echo "⚠️  upgrade gagal, coba dengan --offline"
              flutter pub get --offline 2>&1 || {
                echo "❌ Gagal semua, lanjut build dengan skip validation"
              }
            }
          }

      # ── BUILD APK ──────────────────────────────────────────────────────────
      - name: "[ZIP] Build APK (skip validation)"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          flutter build apk --${{ steps.parse.outputs.build_type }} \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: "[ZIP] Upload APK"
        if: steps.parse.outputs.mode == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.root_zip.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ════════════════════════════════════════════════════════════════════════
      # MODE URL — Web2APK
      # ════════════════════════════════════════════════════════════════════════
      - name: "[URL] Create Flutter WebView project"
        if: steps.parse.outputs.mode == 'url'
        run: |
          flutter create --org com.gojocrasher --project-name webview_app webview_project
          cd webview_project
          flutter pub add webview_flutter

      - name: "[URL] Patch main.dart"
        if: steps.parse.outputs.mode == 'url'
        run: |
          cat > webview_project/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ steps.parse.outputs.app_name }}',
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ steps.parse.outputs.url }}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          DART

      - name: "[URL] Patch app name"
        if: steps.parse.outputs.mode == 'url'
        run: |
          APP="${{ steps.parse.outputs.app_name }}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP}\"/" \
            webview_project/android/app/src/main/AndroidManifest.xml

      - name: "[URL] Download & apply custom icon"
        if: steps.parse.outputs.mode == 'url' && steps.parse.outputs.icon_url != ''
        run: |
          wget -q -O icon_raw "${{ steps.parse.outputs.icon_url }}"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dir="mipmap-mdpi"    ;;
              72)  dir="mipmap-hdpi"    ;;
              96)  dir="mipmap-xhdpi"   ;;
              144) dir="mipmap-xxhdpi"  ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            TARGET="webview_project/android/app/src/main/res/${dir}"
            mkdir -p "$TARGET"
            convert icon_raw -resize ${size}x${size} "$TARGET/ic_launcher.png"
          done

      - name: "[URL] Flutter pub get"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter pub get

      - name: "[URL] Build APK"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: "[URL] Upload APK"
        if: steps.parse.outputs.mode == 'url'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: webview_project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
