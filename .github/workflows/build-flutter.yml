name: Build Flutter APK (Ultra Universal)

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Parse payload ─────────────────────────────────────────────────
      - name: Parse payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)"                    >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)"                         >> $GITHUB_OUTPUT
          echo "build_type=$(jq -r '.buildType // "release"' payload.json)"     >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.appName // "MyApp"' payload.json)"           >> $GITHUB_OUTPUT
          echo "icon_url=$(jq -r '.iconUrl // ""' payload.json)"                >> $GITHUB_OUTPUT
          echo "flutter_version=$(jq -r '.flutterVersion // "stable"' payload.json)" >> $GITHUB_OUTPUT

      # ── 2. Setup Java ────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Setup Flutter ─────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.parse.outputs.flutter_version }}
          cache: true

      # ── 4. Deteksi versi base ────────────────────────────────────────────
      - name: Detect base versions
        id: versions
        run: |
          FLUTTER_VER=$(flutter --version | head -1 | grep -oP '\d+\.\d+\.\d+')
          DART_VER=$(dart --version 2>&1 | grep -oP '\d+\.\d+\.\d+')
          FLUTTER_BASE=$(echo $FLUTTER_VER | cut -d. -f1-2)
          DART_BASE=$(echo $DART_VER | cut -d. -f1-2)
          DART_MAJOR=$(echo $DART_VER | cut -d. -f1)

          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "dart_version=$DART_VER"       >> $GITHUB_OUTPUT
          echo "flutter_base=$FLUTTER_BASE"   >> $GITHUB_OUTPUT
          echo "dart_base=$DART_BASE"         >> $GITHUB_OUTPUT
          echo "dart_major=$DART_MAJOR"       >> $GITHUB_OUTPUT

          echo "🔍 Flutter base: $FLUTTER_BASE"
          echo "🔍 Dart base: $DART_BASE"
          echo "🔍 Dart major: $DART_MAJOR"

      # ═════════════════════════════════════════════════════════════════════
      # UNIVERSAL ANDROID SDK SYNC SCRIPT (long-term safe)
      # Dibuat sekali, dipakai oleh kedua mode (zip & url).
      # ═════════════════════════════════════════════════════════════════════
      - name: "Prepare Android SDK sync script"
        run: |
          mkdir -p /tmp/ci
          cat > /tmp/ci/sync-android-sdk.sh << 'SYNC'
          #!/usr/bin/env bash
          # -----------------------------------------------------------------
          # Auto-sync Android SDK versions.
          #  1. Scan compileSdk dari app + semua plugin di pub-cache
          #  2. Tentukan MAX (minimal MIN_SDK)
          #  3. Install platforms;android-$MAX kalau belum ada
          #  4. Patch semua plugin + app supaya pakai $MAX
          #
          # Ubah MIN_SDK kalau suatu hari baseline Flutter naik.
          # -----------------------------------------------------------------
          set -uo pipefail

          PROJECT_DIR="${1:-.}"
          MIN_SDK=36
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache/hosted/pub.dev}"

          echo "📂 Project: $PROJECT_DIR"
          echo "🔎 Scanning compileSdk di app + plugin..."

          ALL=$(mktemp)
          # 1) app
          for f in "$PROJECT_DIR/android/app/build.gradle" \
                   "$PROJECT_DIR/android/app/build.gradle.kts"; do
            [ -f "$f" ] || continue
            grep -oP 'compileSdk(Version)?\s*=?\s*\K[0-9]+' "$f" >> "$ALL" 2>/dev/null || true
          done

          # 2) plugins
          if [ -d "$PUB_CACHE" ]; then
            while IFS= read -r f; do
              grep -oP 'compileSdk(Version)?\s*=?\s*\K[0-9]+' "$f" >> "$ALL" 2>/dev/null || true
            done < <(find "$PUB_CACHE" -maxdepth 4 \
                        \( -name build.gradle -o -name build.gradle.kts \) \
                        -path '*/android/*' 2>/dev/null)
          fi

          # 3) hitung max
          MAX=$( { cat "$ALL"; echo "$MIN_SDK"; } | sort -n | tail -1 )
          [ -z "$MAX" ] && MAX=$MIN_SDK
          echo "🎯 compileSdk tertinggi terdeteksi: $MAX"

          # 4) install platform kalau belum ada
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || \
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"

          if [ ! -d "$ANDROID_HOME/platforms/android-$MAX" ]; then
            echo "📥 Installing platforms;android-$MAX ..."
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-$MAX" || \
              echo "⚠️  platforms;android-$MAX belum tersedia di repo — coba lanjut"
          else
            echo "✅ platforms;android-$MAX sudah ada"
          fi
          ls "$ANDROID_HOME/platforms" || true

          # 5) patch semua plugin
          if [ -d "$PUB_CACHE" ]; then
            while IFS= read -r f; do
              sed -i -E \
                -e "s/(compileSdkVersion\s*=?\s*)[0-9]+/\1$MAX/g" \
                -e "s/(compileSdk\s*=?\s*)[0-9]+/\1$MAX/g" \
                "$f" 2>/dev/null || true
            done < <(find "$PUB_CACHE" -maxdepth 4 \
                        \( -name build.gradle -o -name build.gradle.kts \) \
                        -path '*/android/*' 2>/dev/null)
            echo "✅ Semua plugin di pub-cache dipatch → compileSdk=$MAX"
          fi

          # 6) patch app
          if [ -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
            sed -i -E "s/(compileSdk\s*=\s*)[0-9]+/\1$MAX/" "$PROJECT_DIR/android/app/build.gradle.kts"
            sed -i -E "s/(targetSdk\s*=\s*)[0-9]+/\1$MAX/"  "$PROJECT_DIR/android/app/build.gradle.kts"
          fi
          if [ -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            sed -i -E "s/(compileSdkVersion\s*=?\s*)[0-9]+/\1$MAX/" "$PROJECT_DIR/android/app/build.gradle"
            sed -i -E "s/(targetSdkVersion\s*=?\s*)[0-9]+/\1$MAX/"  "$PROJECT_DIR/android/app/build.gradle"
          fi

          echo "🎉 Android SDK sync selesai (compileSdk/targetSdk=$MAX)"
          SYNC
          chmod +x /tmp/ci/sync-android-sdk.sh

      # ═════════════════════════════════════════════════════════════════════
      # MODE ZIP
      # ═════════════════════════════════════════════════════════════════════
      - name: "[ZIP] Download & extract"
        if: steps.parse.outputs.mode == 'zip'
        run: |
          wget -q -O project.zip "${{ steps.parse.outputs.url }}"
          unzip -q project.zip -d project

      - name: "[ZIP] Find Flutter root"
        if: steps.parse.outputs.mode == 'zip'
        id: root_zip
        run: |
          DIR=$(find project -name "pubspec.yaml" -maxdepth 5 | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      # ── FIX GRADLE WRAPPER ──────────────────────────────────────────────
      - name: "[ZIP] Force Gradle 8.14.1"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|gradle-[0-9][0-9.]*-[a-z]*\.zip|gradle-8.14.1-bin.zip|g' "$WRAPPER"
            echo "✅ Gradle → 8.14.1"
          fi

      # ── FIX KOTLIN DSL ──────────────────────────────────────────────────
      - name: "[ZIP] Fix Kotlin DSL"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "🔧 Fixing Kotlin DSL..."

            ORIG_APP_ID=$(grep -oP '(?<=applicationId\s=\s")[^"]+' android/app/build.gradle.kts | head -1)
            ORIG_NAMESPACE=$(grep -oP '(?<=namespace\s=\s")[^"]+' android/app/build.gradle.kts | head -1)

            if [ -z "$ORIG_APP_ID" ] && [ -f "android/app/src/main/AndroidManifest.xml" ]; then
              ORIG_APP_ID=$(grep -oP '(?<=package=")[^"]+' android/app/src/main/AndroidManifest.xml | head -1)
            fi

            ORIG_APP_ID=${ORIG_APP_ID:-com.example.app}
            ORIG_NAMESPACE=${ORIG_NAMESPACE:-$ORIG_APP_ID}

            echo "📦 applicationId asli: $ORIG_APP_ID"
            echo "📦 namespace asli: $ORIG_NAMESPACE"

            cat > android/build.gradle.kts << 'EOF'
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.buildDir = File("../build")
          subprojects {
            project.buildDir = File("${rootProject.buildDir}/${project.name}")
          }
          subprojects {
            project.evaluationDependsOn(":app")
          }

          tasks.register<Delete>("clean") {
            delete(rootProject.buildDir)
          }
          EOF

            cat > android/app/build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("dev.flutter.flutter-gradle-plugin")
          }

          android {
            namespace = "__NAMESPACE__"
            compileSdk = 36

            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
              jvmTarget = "17"
            }

            defaultConfig {
              applicationId = "__APPLICATION_ID__"
              minSdk = 21
              targetSdk = 36
              versionCode = 1
              versionName = "1.0"
            }

            buildTypes {
              release {
                isMinifyEnabled = true
                isShrinkResources = true
                signingConfig = signingConfigs.getByName("debug")
                proguardFiles(
                  getDefaultProguardFile("proguard-android-optimize.txt"),
                  "proguard-rules.pro"
                )
              }
            }
          }

          flutter {
            source = "../.."
          }
          EOF

            touch android/app/proguard-rules.pro

            sed -i "s/__NAMESPACE__/${ORIG_NAMESPACE}/"     android/app/build.gradle.kts
            sed -i "s/__APPLICATION_ID__/${ORIG_APP_ID}/"   android/app/build.gradle.kts

            echo "✅ Kotlin DSL fixed"
          fi

      # ── FIX GROOVY DSL ──────────────────────────────────────────────────
      - name: "[ZIP] Fix Groovy DSL"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          if [ -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "🔧 Fixing Groovy DSL..."

            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.1-bin.zip" \
              > android/gradle/wrapper/gradle-wrapper.properties

            cat > android/build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.7.2'
              classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20"
            }
          }

          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.buildDir = '../build'
          subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
            project.evaluationDependsOn(':app')
          }

          tasks.register('clean', Delete) {
            delete rootProject.buildDir
          }
          EOF

            echo "✅ Groovy DSL fixed"
          fi

      # ── PUBSPEC: Semua dep 'any' mengikuti base ─────────────────────────
      - name: "[ZIP] Make all dependencies 'any' (follow base)"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          PUBSPEC="pubspec.yaml"
          if [ -f "$PUBSPEC" ]; then
            cp "$PUBSPEC" "$PUBSPEC.bak"

            DART_MAJOR=${{ steps.versions.outputs.dart_major }}
            FLUTTER_BASE=${{ steps.versions.outputs.flutter_base }}

            echo "🔍 Base Flutter: $FLUTTER_BASE"
            echo "🔍 Base Dart major: $DART_MAJOR"

            SDK_LINE="  sdk: \">=${DART_MAJOR}.0.0 <$((DART_MAJOR+1)).0.0\""
            awk -v new="$SDK_LINE" '
              /^environment:/ { print; in_env=1; injected=0; next }
              in_env && /^[^[:space:]]/ {
                if (!injected) print new
                in_env=0
              }
              in_env && /sdk[[:space:]]*:/ { print new; injected=1; next }
              { print }
              END { if (in_env && !injected) print new }
            ' "$PUBSPEC" > "$PUBSPEC.tmp" && mv "$PUBSPEC.tmp" "$PUBSPEC"

            echo "🔧 environment.sdk sekarang: $(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:')"

            sed -i '/^[[:space:]]/s/: \^[0-9][0-9.]*$/: any/' "$PUBSPEC"
            sed -i '/^[[:space:]]/s/: [0-9][0-9.]*$/: any/'  "$PUBSPEC"

            if ! grep -q "^dependency_overrides:" "$PUBSPEC"; then
              {
                echo ""
                echo "dependency_overrides:"
                echo "  # Mengikuti versi base Flutter $FLUTTER_BASE"
                echo "  plugin_platform_interface: any"
                echo "  flutter_plugin_android_lifecycle: any"
              } >> "$PUBSPEC"
            fi

            echo "✅ pubspec.yaml → semua mengikuti base Flutter $FLUTTER_BASE"
          fi

      # ── HAPUS LOCKFILE LAMA ─────────────────────────────────────────────
      - name: "[ZIP] Hapus pubspec.lock lama"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          if [ -f "pubspec.lock" ]; then
            rm -f pubspec.lock
            echo "🗑️  pubspec.lock lama dihapus, dependency akan di-resolve ulang"
          fi

      # ── PUB GET ─────────────────────────────────────────────────────────
      - name: "[ZIP] Pub get"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          flutter pub get 2>&1 || {
            echo "⚠️  pub get gagal, coba upgrade"
            flutter pub upgrade --major-versions 2>&1 || {
              echo "⚠️  upgrade gagal, coba dengan --offline"
              flutter pub get --offline 2>&1 || {
                echo "❌ Gagal semua, lanjut build dengan skip validation"
              }
            }
          }

      # ── SYNC ANDROID SDK (ZIP) ──────────────────────────────────────────
      - name: "[ZIP] Sync Android SDK versions"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: bash /tmp/ci/sync-android-sdk.sh "$PWD"

      # ── BUILD APK (ZIP) ─────────────────────────────────────────────────
      - name: "[ZIP] Build APK (skip validation)"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          flutter build apk --${{ steps.parse.outputs.build_type }} \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: "[ZIP] Upload APK"
        if: steps.parse.outputs.mode == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.root_zip.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ═════════════════════════════════════════════════════════════════════
      # MODE URL — Web2APK
      # ═════════════════════════════════════════════════════════════════════
      - name: "[URL] Create Flutter WebView project"
        if: steps.parse.outputs.mode == 'url'
        run: |
          flutter create --org com.gojocrasher --project-name webview_app webview_project
          cd webview_project
          flutter pub add webview_flutter

      - name: "[URL] Patch main.dart"
        if: steps.parse.outputs.mode == 'url'
        run: |
          cat > webview_project/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ steps.parse.outputs.app_name }}',
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ steps.parse.outputs.url }}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          DART

      - name: "[URL] Patch app name"
        if: steps.parse.outputs.mode == 'url'
        run: |
          APP="${{ steps.parse.outputs.app_name }}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP}\"/" \
            webview_project/android/app/src/main/AndroidManifest.xml

      - name: "[URL] Download & apply custom icon"
        if: steps.parse.outputs.mode == 'url' && steps.parse.outputs.icon_url != ''
        run: |
          wget -q -O icon_raw "${{ steps.parse.outputs.icon_url }}"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dir="mipmap-mdpi"    ;;
              72)  dir="mipmap-hdpi"    ;;
              96)  dir="mipmap-xhdpi"   ;;
              144) dir="mipmap-xxhdpi"  ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            TARGET="webview_project/android/app/src/main/res/${dir}"
            mkdir -p "$TARGET"
            convert icon_raw -resize ${size}x${size} "$TARGET/ic_launcher.png"
          done

      - name: "[URL] Flutter pub get"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter pub get

      # ── SYNC ANDROID SDK (URL) ──────────────────────────────────────────
      - name: "[URL] Sync Android SDK versions"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: bash /tmp/ci/sync-android-sdk.sh "$PWD"

      - name: "[URL] Build APK"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      - name: "[URL] Upload APK"
        if: steps.parse.outputs.mode == 'url'
        uses: actions/upload-artifact@v4
        with:
          na
